name = "sablon"
main = "src/index.js"
compatibility_date = "2026-06-13"

[vars]
APP_BASE_URL = "https://easyredesign.biz.id"
WORKER_BASE_URL = "https://sablon.jho-j80.workers.dev"
MIDTRANS_MERCHANT_ID = "M020138519"
MIDTRANS_CLIENT_KEY = "Mid-client-poSk7Xki68kLxq8F"
MIDTRANS_IS_PRODUCTION = "0"
AIVENE_BASE_URL = "https://api.aivene.com/v1"
AIVENE_IMAGE_MODEL = "gpt-image-2"
AIVENE_MAX_IMAGE_INPUT_BYTES = "20971520"
OPENAI_IMAGE_MODEL = "gpt-image-2"
AI_REDRAW_PROMPT_PROFILE = "logo_photo_cleanup_short"
AI_REDRAW_IMAGE_QUALITY = "medium"
AI_REDRAW_IMAGE_SIZE = "1K"
AI_REDRAW_INPUT_MAX_EDGE = "1080"
AI_REDRAW_PRESET = "standard"
AI_REDRAW_PRIMARY_PROVIDER = "aivene_image"
AI_REDRAW_FALLBACK_PROVIDER = "openai_image"
GOOGLE_OAUTH_CLIENT_ID = "646496051749-igoj18gaq83onf474thvepuj8atonuuv.apps.googleusercontent.com"
# Redirect URI OAuth Google harus sama dengan yang terdaftar di Google Cloud Console.
GOOGLE_OAUTH_REDIRECT_TO = "https://sablon.jho-j80.workers.dev/api/auth/google/callback"
LOGO_RESTORE_ENABLED = "1"
LOGO_RESTORE_STRICT_SPOTS = "1"
REQUIRE_PROCESSOR_AUTH = "1"
INTERACTIVE_QRIS_SOURCE_PACKAGE = "com.interactive.qrisid"
INTERACTIVE_QRIS_MIN_AMOUNT_IDR = "2000"
INTERACTIVE_QRIS_UNIQUE_DIGITS = "2"
# Isi setelah backend processor berhasil deploy ke Cloud Run.
# PROCESSOR_BASE_URL = "https://design-mudah-processor-xxxxx.a.run.app"

[[d1_databases]]
binding = "DB"
database_name = "sablon-db"
database_id = "d0a7a071-89f8-4931-9c6b-58b3cc7f4191"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "sablon-assets"

# Secrets diset via `npx wrangler secret put <NAMA>` atau dashboard Cloudflare Worker > Settings > Variables and Secrets.
# Wajib: AUTH_JWT_SECRET, GOOGLE_OAUTH_CLIENT_SECRET, MIDTRANS_SERVER_KEY, SIGNUP_BONUS_HASH_SALT,
# INTERACTIVE_QRIS_WEBHOOK_SECRET, AIVENE_API_KEY, OPENAI_API_KEY
